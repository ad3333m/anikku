<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <title>Cinejoy · Ciname</title>
  <style>
    :root { --bar: 54px; --lime: #95ff50; --ink: #f2f3f5; --muted: rgba(242, 243, 245, .6); }
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #050505; color: var(--ink); overflow: hidden;
      font: 15px/1.4 -apple-system, system-ui, 'Segoe UI', sans-serif; }
    body { display: flex; flex-direction: column; }

    /* the browser bar */
    .bar { flex: none; display: flex; align-items: center; gap: 6px; height: calc(var(--bar) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
      background: #0b0b0d; border-bottom: 1px solid rgba(255, 255, 255, .07); }
    .bar button { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center;
      background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, transform .12s; }
    .bar button:hover { background: rgba(255, 255, 255, .08); }
    .bar button:active { transform: scale(.9); }
    .bar button:disabled { opacity: .3; pointer-events: none; }
    .bar .home { background: rgba(149, 255, 80, .14); color: var(--lime); margin-right: 4px; }
    .bar .home:hover { background: rgba(149, 255, 80, .24); }
    .where { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px 0 8px;
      border-radius: 999px; background: rgba(255, 255, 255, .06); margin-left: 4px; }
    .where img { width: 24px; height: 24px; border-radius: 7px; flex: none; }
    .where b { font-weight: 700; flex: none; }
    .where span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
    .lock { flex: none; color: var(--lime); opacity: .8; }
    @media (max-width: 520px) { .bar .fwd, .where b { display: none; } }

    /* the page */
    .stage { position: relative; flex: 1; min-height: 0; background: #050505; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #050505; }
    .veil { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center; background: radial-gradient(60vmax 60vmax at 50% 40%, rgba(149, 255, 80, .08), transparent 70%), #050505;
      transition: opacity .35s; }
    .veil.done { opacity: 0; pointer-events: none; }
    .veil img { width: 74px; height: 74px; border-radius: 20px; box-shadow: 0 12px 40px -8px rgba(149, 255, 80, .45); }
    .veil p { color: var(--muted); max-width: 360px; }
    .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .12); border-top-color: var(--lime);
      animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .veil.bad .spin { display: none; }
    .veil .retry { display: none; height: 42px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--lime); color: #0a1a03;
      font: 700 15px/1 inherit; cursor: pointer; }
    .veil.bad .retry { display: inline-block; }
  </style>
</head>
<body>
  <div class="bar">
    <button class="home" id="home" aria-label="Back to the picker" title="Back to the picker">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
    </button>
    <button id="back" aria-label="Back" title="Back" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="fwd" id="fwd" aria-label="Forward" title="Forward" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload" aria-label="Reload" title="Reload">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <div class="where">
      <img src="cinejoy.png" alt="">
      <b>Cinejoy</b>
      <span id="addr">cinejoy.pk</span>
      <svg class="lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="veil" id="veil">
      <img src="cinejoy.png" alt="">
      <div class="spin"></div>
      <p id="status">Connecting…</p>
      <button class="retry" id="retry">Try again</button>
    </div>
  </div>

  <script src="scram/scramjet.all.js"></script>
  <script src="baremux/index.js"></script>
  <script>
    // Cinejoy inside the Ciname website. cinejoy.pk refuses to be framed by other sites, so it's opened
    // through the Scramjet proxy (a service worker on this site, over a public Wisp relay), the same way
    // BrickyProcky's browser works. The bar's first button goes back to the picker.
    (() => {
      const HOME = 'https://cinejoy.pk/';
      const BASE = new URL('./', location).pathname;
      const RELAYS = ['wss://wisp.mercurywork.shop/', 'wss://anura.pro/'];
      const $ = id => document.getElementById(id);
      const veil = $('veil'), status = $('status');
      let scramjet, frame, conn;

      const say = (text, bad) => { status.textContent = text; veil.classList.toggle('bad', !!bad); veil.classList.remove('done'); };

      // a relay counts as up once its WebSocket opens
      const probe = url => new Promise((resolve, reject) => {
        let ws;
        const timer = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('timeout')); }, 7000);
        try { ws = new WebSocket(url); } catch (e) { clearTimeout(timer); reject(e); return; }
        ws.onopen = () => { clearTimeout(timer); ws.close(); resolve(url); };
        ws.onerror = () => { clearTimeout(timer); reject(new Error('error')); };
      });

      // the proxied pages share this site's origin, so their pop-ups can be switched off
      const noPopups = win => {
        try {
          win.open = () => null;
          for (let i = 0; i < win.frames.length; i++) noPopups(win.frames[i]);
        } catch (e) { /* a frame that isn't proxied */ }
      };

      const start = async () => {
        if (!('serviceWorker' in navigator)) throw new Error("This browser won't run Cinejoy here (service workers are off). Try a normal window instead of a private one.");
        say('Starting…');
        if (!scramjet) {
          const { ScramjetController } = window.$scramjetLoadController();
          scramjet = new ScramjetController({
            prefix: BASE + 'go/',
            files: { wasm: BASE + 'scram/scramjet.wasm.wasm', all: BASE + 'scram/scramjet.all.js', sync: BASE + 'scram/scramjet.sync.js' },
          });
          await scramjet.init();
        }
        await navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE, updateViaCache: 'none' });
        await navigator.serviceWorker.ready;
        if (!conn) conn = new window.BareMux.BareMuxConnection(BASE + 'baremux/worker.js');
        say('Connecting…');
        let relay;
        try { relay = await Promise.any(RELAYS.map(u => probe(u))); }
        catch (e) { throw new Error("Couldn't reach the connection relay. Your network may be blocking it."); }
        // Epoxy, not libcurl: libcurl's built-in certificate list can't follow cinejoy.pk's newer
        // Let's Encrypt chain (Root YR, cross-signed by ISRG Root X1) and refuses the site
        await conn.setTransport(location.origin + BASE + 'epoxy/index.mjs', [{ wisp: relay }]);

        say('Opening Cinejoy…');
        if (!frame) {
          frame = scramjet.createFrame();
          const f = frame.frame;
          f.title = 'Cinejoy';
          f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
          f.allowFullscreen = true;
          $('stage').prepend(f);
          frame.addEventListener('urlchange', e => {
            try { $('addr').textContent = new URL(String(e.url)).host + new URL(String(e.url)).pathname.replace(/\/$/, ''); } catch (err) {}
            $('back').disabled = false;
          });
          f.addEventListener('load', () => {
            veil.classList.add('done');
            noPopups(f.contentWindow);
          });
        }
        frame.go(HOME);
      };

      const run = () => start().catch(err => say(err.message || 'Cinejoy didn’t open.', true));

      $('home').onclick = () => { location.href = '../'; };
      $('back').onclick = () => { try { frame.frame.contentWindow.history.back(); $('fwd').disabled = false; } catch (e) {} };
      $('fwd').onclick = () => { try { frame.frame.contentWindow.history.forward(); } catch (e) {} };
      $('reload').onclick = () => { try { frame.frame.contentWindow.location.reload(); } catch (e) { run(); } };
      $('retry').onclick = run;
      run();
    })();
  </script>
</body>
</html>
