<!-- Ciname website passcode screen. site/build.py puts this at the top of every page and fills in
     {{HASH}} (SHA-256 of "ciname:" + the passcode) and {{LOGO}}. A correct code only lasts while you move
     around the site in that tab: a refresh, a new tab or a new visit asks again. The site is public
     hosting, so this keeps casual visitors out; it is not encryption. -->
<style id="ciname-gate-style">
  html.ciname-locked, html.ciname-locked body { overflow: hidden !important; }
  html.ciname-locked body > :not(#ciname-gate) { visibility: hidden !important; }
  #ciname-gate { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(70vmax 70vmax at 0% 0%, rgba(149, 255, 80, .16), transparent 60%),
                radial-gradient(70vmax 70vmax at 100% 100%, rgba(255, 122, 26, .2), transparent 60%), #060608;
    color: #f4f4f6; font-family: 'Outfit', ui-rounded, -apple-system, system-ui, 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none; transition: opacity .35s, transform .35s; }
  #ciname-gate.open { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #ciname-gate .brand { display: flex; align-items: center; gap: 12px; }
  #ciname-gate .brand img { width: 52px; height: 52px; filter: drop-shadow(0 6px 18px rgba(255, 150, 40, .4)); }
  #ciname-gate .brand span { font-weight: 900; font-size: 38px; letter-spacing: -.02em;
    background: linear-gradient(100deg, #95ff50, #ffd640 45%, #ff7a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #ciname-gate p { margin: 0; color: rgba(244, 244, 246, .62); font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #ciname-gate .dots { display: flex; gap: 16px; height: 18px; }
  #ciname-gate .dots i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); transition: background .15s, box-shadow .15s, transform .15s; }
  #ciname-gate .dots i.on { background: linear-gradient(135deg, #ffd640, #ff7a1a); box-shadow: 0 0 14px rgba(255, 150, 40, .6); transform: scale(1.1); }
  #ciname-gate .dots.bad { animation: ciname-shake .42s; }
  #ciname-gate .dots.bad i { background: #ff4d4d; box-shadow: none; }
  @keyframes ciname-shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  #ciname-gate .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 22px; margin-top: 6px; }
  #ciname-gate button { width: 76px; height: 76px; border: 0; border-radius: 50%; padding: 0; cursor: pointer; color: #fff;
    font: 600 28px/1 inherit; font-family: inherit; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
    -webkit-tap-highlight-color: transparent; transition: background .12s, transform .12s; }
  #ciname-gate button:active, #ciname-gate button.hit { background: rgba(255, 150, 40, .35); transform: scale(.94); }
  #ciname-gate button.ghost { background: none; box-shadow: none; font-size: 15px; color: rgba(244, 244, 246, .7); }
  @media (max-height: 640px) { #ciname-gate { gap: 14px; } #ciname-gate .pad { grid-template-columns: repeat(3, 62px); gap: 10px 18px; } #ciname-gate button { width: 62px; height: 62px; font-size: 24px; } }
</style>
<script>
  (() => {
    const HASH = '{{HASH}}', KEY = 'ciname.gate', LEN = 6;
    // unlocked for this tab only (sessionStorage), and a refresh always locks it again
    let ok = false;
    try {
      localStorage.removeItem(KEY);                       // from when an unlock was remembered for good
      const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      if (nav && nav.type === 'reload') sessionStorage.removeItem(KEY);
      ok = sessionStorage.getItem(KEY) === HASH;
    } catch (e) { /* storage blocked: ask every time */ }
    if (ok) return;
    document.documentElement.classList.add('ciname-locked');

    const sha = async text => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const build = () => {
      const gate = document.createElement('div');
      gate.id = 'ciname-gate';
      gate.innerHTML = '<div class="brand"><img alt="" src="{{LOGO}}"><span>Ciname</span></div>' +
        '<p>Enter the passcode</p><div class="dots">' + '<i></i>'.repeat(LEN) + '</div><div class="pad">' +
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button type="button" data-d="' + n + '">' + n + '</button>').join('') +
        '<span></span><button type="button" data-d="0">0</button><button type="button" class="ghost" data-del>Delete</button></div>';
      document.body.appendChild(gate);
      const dots = gate.querySelectorAll('.dots i'), dotsBox = gate.querySelector('.dots');
      let code = '', busy = false;
      const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < code.length));
      const check = async () => {
        busy = true;
        if (await sha('ciname:' + code) === HASH) {
          try { sessionStorage.setItem(KEY, HASH); } catch (e) { /* this page only */ }
          gate.classList.add('open');
          document.documentElement.classList.remove('ciname-locked');
          setTimeout(() => gate.remove(), 400);
          return;
        }
        dotsBox.classList.add('bad');
        setTimeout(() => { dotsBox.classList.remove('bad'); code = ''; paint(); busy = false; }, 450);
      };
      const press = d => {
        if (busy) return;
        if (d === 'del') code = code.slice(0, -1);
        else if (code.length < LEN) code += d;
        paint();
        if (code.length === LEN) check();
      };
      gate.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b) press(b.hasAttribute('data-del') ? 'del' : b.dataset.d);
      });
      document.addEventListener('keydown', e => {
        if (!document.getElementById('ciname-gate')) return;
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === 'Backspace') press('del');
        else return;
        const b = gate.querySelector(e.key === 'Backspace' ? '[data-del]' : '[data-d="' + e.key + '"]');
        if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); }
        e.preventDefault();
      }, true);
    };
    if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  })();
</script>
