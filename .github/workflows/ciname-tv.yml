name: Ciname TV APK

on:
  push:
    branches: [main]
    paths: ["ciname-tv/**", "ciname/Launcher/**", "ciname/tools/inline_launcher.py", "docs/**", "ios/bundle_web.py", ".github/workflows/ciname-tv.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keeping the debug keystore between runs means an update installs over the previous one.
      - name: Reuse the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ciname-tv-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The pages the app serves: Anikku's site and player skin, and the picker
      - name: Bundle the pages into the APK's assets
        run: |
          python3 ios/bundle_web.py ciname-tv/app/src/main/assets/anikku
          python3 ciname/tools/inline_launcher.py ciname-tv/app/src/main/assets/picker
          ls -la ciname-tv/app/src/main/assets/*

      - name: Unit tests
        run: gradle -p ciname-tv :app:testReleaseUnitTest

      - name: Build the APK
        run: gradle -p ciname-tv :app:assembleRelease

      - name: Name it
        run: |
          set -eu
          SRC=$(find ciname-tv/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$SRC" || { echo "no apk was produced"; exit 1; }
          mkdir -p out
          cp "$SRC" out/Ciname-TV.apk
          echo "built $(du -h out/Ciname-TV.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Ciname-TV-apk
          path: out/Ciname-TV.apk
          if-no-files-found: error

  tv-emulator:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Ciname-TV-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android TV emulator with the remote
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash ciname-tv/tools/emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-screenshots
          path: tv-shots/
